[package]
name = "aqa-desktop"
version = "1.0.0-beta.1"
description = "Augmented Qualitative Analysis"
authors = ["AQA"]
edition = "2021"
license = "MIT"
publish = false

[build-dependencies]
tauri-build = { version = "2.5.3", features = [] }

[dependencies]
serde_json = "1.0"
tauri = { version = "2.10.2", features = [] }
tauri-plugin-dialog = "2.4.1"
tauri-plugin-single-instance = "2.3.7"

[target.'cfg(not(target_os = "macos"))'.dependencies]
tauri-plugin-notification = "2.4.0"

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_System_Power"] }

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6.2"
objc2 = "0.6.4"
objc2-foundation = "0.3.2"
objc2-user-notifications = { version = "0.3.2", default-features = false, features = ["block2", "UNNotificationContent", "UNNotificationRequest", "UNNotificationSettings", "UNNotificationSound", "UNNotificationTrigger", "UNUserNotificationCenter"] }
