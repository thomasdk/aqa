[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
norecursedirs = ["test_results"]
markers = [
    "integration: Integration tests that require a running LM Studio server",
]

[tool.ruff]
target-version = "py313"
line-length = 100
extend-exclude = [
    "README_files",
]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B", "C90"]

[tool.ruff.lint.mccabe]
max-complexity = 15

[tool.ruff.lint.per-file-ignores]
# These tests intentionally assert that all invalid settings fail, independent
# of the exact Pydantic exception subclass used by a future dependency release.
"tests/test_reload_and_settings.py" = ["B017"]

[tool.coverage.run]
branch = true
source = ["src"]

[tool.coverage.report]
show_missing = true
skip_covered = false
